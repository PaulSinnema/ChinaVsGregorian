<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14090a" />
    <!-- Revalidate the page itself on every visit (hint for browsers that honour it) -->
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>China vs Gregoriaans</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <style>
        :root { --red: #c8102e; --gold: #e8b84a; --text: #f6ece2; --muted: #c9b8a8; }
        html, body { margin: 0; min-height: 100%; color: var(--text); font-family: system-ui, "Segoe UI", Arial, sans-serif; }
        body { background: radial-gradient(circle at top, #3a1210, #14090a 60%) fixed; background-color: #14090a; }
        .version { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); z-index: 40; font-size: 14px; opacity: .85; }
        .loading { padding: 40px 16px; text-align: center; color: var(--muted); }
        .page { max-width: 820px; margin: 0 auto; padding: calc(40px + env(safe-area-inset-top)) 16px 32px; }
        h1 { margin: 0; font-size: clamp(28px, 6vw, 44px); color: var(--gold); letter-spacing: 1px; }
        h1 span { color: var(--text); font-weight: 300; font-size: .6em; }
        .sub { color: var(--muted); margin: 6px 0 20px; }
        .card { background: rgba(34,17,15,.85); border: 1px solid rgba(232,184,74,.25); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .card h2 { margin: 0 0 12px; font-size: 20px; color: var(--gold); }
        .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
        label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
        input, select { font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(232,184,74,.4); background: #100706; color: var(--text); color-scheme: dark; }
        input[type=number] { width: 100px; }
        button { font: inherit; font-size: 16px; padding: 9px 16px; border: 0; border-radius: 8px; background: var(--red); color: #fff; cursor: pointer; }
        button:hover { filter: brightness(1.15); }
        .result { display: flex; gap: 16px; align-items: center; margin-top: 12px; }
        .emoji { font-size: 64px; line-height: 1; }
        .han { font-size: clamp(20px, 5vw, 28px); color: var(--gold); margin-bottom: 4px; }
        .line { margin: 4px 0; }
        .hanin { color: var(--gold); font-size: 1.2em; }
        .err { color: #ff8a7a; }
        .note { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
        .tablewrap { overflow-x: auto; }
        table.ny { width: 100%; border-collapse: collapse; font-size: 14px; }
        table.ny th { text-align: left; font-weight: normal; color: var(--muted); padding: 6px; border-bottom: 1px solid rgba(232,184,74,.3); }
        table.ny td { padding: 6px; border-bottom: 1px solid rgba(255,255,255,.06); white-space: nowrap; }
        table.ny tbody tr { cursor: pointer; }
        table.ny tbody tr:hover td { background: rgba(255,255,255,.06); }
        table.ny tr.sel td { background: rgba(200,16,46,.35); }
        @media (max-width: 520px) { .emoji { font-size: 48px; } .result { align-items: flex-start; } .version { font-size: 12px; } }
        #blazor-error-ui { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; padding: 8px 12px; background: #b32121; }
        #blazor-error-ui .dismiss { float: right; cursor: pointer; }
    </style>
    <script type="importmap"></script>
    <script>
        // Auto-update + recovery from stale cached HTML (GitHub Pages caches ~10 min)
        (function () {
            const KEY = 'cg-recover';
            function reloadFresh(param, value) {
                const url = new URL(location.href);
                url.searchParams.set(param, value);
                location.replace(url.toString());
            }
            function recover() {
                const n = parseInt(sessionStorage.getItem(KEY) || '0', 10);
                if (n >= 2) return;
                sessionStorage.setItem(KEY, String(n + 1));
                reloadFresh('r', Date.now());
            }
            window.cgRecover = recover;
            const watchdog = setTimeout(recover, 45000);
            let current = null;
            async function check() {
                if (!current) return;
                try {
                    const res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
                    if (!res.ok) return;
                    const data = await res.json();
                    if (data.version && data.version !== current) reloadFresh('v', data.version);
                } catch { }
            }
            window.cgUpdater = {
                start(version) {
                    current = version;
                    clearTimeout(watchdog);
                    sessionStorage.removeItem(KEY);
                    check();
                    setInterval(check, 60000);
                    document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
                    window.addEventListener('focus', check);
                }
            };
        })();
    </script>
</head>
<body>
    <div id="app"><div class="loading">Laden…</div></div>
    <div id="blazor-error-ui">
        Er is een fout opgetreden. <a href="." class="reload">Herladen</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false" onerror="cgRecover()"></script>
    <script>
        // Always revalidate WASM files with the server; cached copy only used on 304
        Blazor.start({
            loadBootResource(type, name, defaultUri, integrity) {
                // JS modules must be returned as a URL; let the runtime load those itself
                if (type === 'dotnetjs' || type.startsWith('js-module')) return defaultUri;
                return fetch(defaultUri, { cache: 'no-cache', credentials: 'omit', integrity: integrity || '' });
            }
        }).catch(() => cgRecover());
    </script>
</body>
</html>
